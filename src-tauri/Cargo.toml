[package]
name = "cendrive"
version = "1.0.0"
description = "CenDrive is a desktop application as database management system."
authors = ["Carlo Dandan <carloddandan.personal@proton.me>"]
license = "MIT"
repository = "https://github.com/carlodandan/cendrive"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cendrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rust_xlsxwriter = "0.99"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
